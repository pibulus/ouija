# Launch hints for Launch Arsenal.
name: Ghost Note
slug: ghostnote
app_type: web-app
production_url: https://ghostnote.rip
audience: people who like strange little web rituals, tiny oracles, and playful divination interfaces
problem: >-
  most random-message toys feel like throwaway fortune cookies; this makes the
  draw feel physical, slow, and a little uncanny
promise: >-
  Summon the board and receive one cosmic message spelled by the planchette.
cta: Summon the board.
differentiators:
  - One-message ritual with no chat, account, input, or queue.
  - The reading waits for one deliberate summon gesture, then stays out of the way.
  - Full-screen board artwork with real coordinate-based planchette movement.
  - Crypto-random local oracle deck keeps the mechanism simple and explicit.
  - Ambient audio and soft generated tones wake only after summon, with a quiet path.
proof_points:
  - Server draws a fresh oracle message on each page load.
  - Server randomizes the board artwork from the static image pool on each page load.
  - Planchette spells each message across real board coordinates.
  - Mobile-first full-screen board with one summon action and one follow-up action.
  - The final omen appears only after the board movement completes.
objections:
  - Confirm production deploy, DNS, and social-card rendering before a public push.
keywords:
  seed:
    - Ghost Note
    - Ouija
    - digital spirit board
    - planchette
    - cosmic message
  audience: strange web ritual people
  intent:
    - draw a cosmic message
    - draw an oracle
    - playful web divination
manual_notes:
  - Keep it oracle-shaped, not chat-shaped.
  - Do not over-explain the mechanism in the first viewport.
